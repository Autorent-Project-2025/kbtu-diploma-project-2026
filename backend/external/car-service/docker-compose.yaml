services:
  postgres:
    image: postgres:18
    container_name: car_service_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - rental_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  flyway:
    image: flyway/flyway:12
    container_name: car_service_flyway
    depends_on:
      postgres:
        condition: service_healthy
    command: migrate
    volumes:
      - ./src/Migrations:/flyway/sql
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      FLYWAY_USER: ${POSTGRES_USER}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD}
      FLYWAY_CONNECT_RETRIES: 30
    restart: "no"

  car-service:
    build:
      context: ./src
      dockerfile: ./CarService.Api/Dockerfile
    ports:
      - "${EXTERNAL_PORT}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Jwt__PublicKey=${Jwt__PublicKey}
      - ConnectionStrings__DbConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - PartnerService__BaseUrl=${PartnerService__BaseUrl}
      - BookingService__BaseUrl=${BookingService__BaseUrl}
      - BookingService__InternalApiKey=${BookingService__InternalApiKey}
      - ClientService__BaseUrl=${ClientService__BaseUrl}
      - ClientService__InternalApiKey=${ClientService__InternalApiKey}
      - ImageService__BaseUrl=${ImageService__BaseUrl}
      - CarMarketValueService__BaseUrl=${CarMarketValueService__BaseUrl}
      - MarketValueRefresh__RefreshAfterHours=${MarketValueRefresh__RefreshAfterHours}
      - MarketValueRefresh__PollIntervalSeconds=${MarketValueRefresh__PollIntervalSeconds}
      - MarketValueRefresh__BatchSize=${MarketValueRefresh__BatchSize}
      - Observability__LogPath=${Observability__LogPath}
    depends_on:
      postgres:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
    volumes:
      - car_logs:/tmp/autorent/car-service

volumes:
  rental_pgdata:
  car_logs:
