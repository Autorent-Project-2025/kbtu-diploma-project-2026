services:
  rabbitmq:
    image: rabbitmq:3.13-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-autorent}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-autorent}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST:-/}
    expose:
      - "5672"
      - "15672"
    ports:
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks:
      - backend

  identity-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres_db
    # Default Postgres ships with max_connections=100 — easy to saturate at
    # 50 VU x N services. Bumping to 300 + warming the page cache with a
    # bigger shared_buffers gives identity-service real headroom under load.
    command:
      - postgres
      - -c
      - max_connections=300
      - -c
      - shared_buffers=128MB
    expose:
      - "5432"
    volumes:
      - identity_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres_db"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - data

  identity-flyway:
    image: flyway/flyway:12
    restart: "no"
    depends_on:
      identity-db:
        condition: service_healthy
    command: migrate
    volumes:
      - ./backend/shared/identity-service/src/Migrations:/flyway/sql:ro
    environment:
      FLYWAY_URL: jdbc:postgresql://identity-db:5432/postgres_db
      FLYWAY_USER: postgres
      FLYWAY_PASSWORD: postgres
      FLYWAY_CONNECT_RETRIES: 30
    networks:
      - data

  identity-service:
    build:
      context: ./backend
      dockerfile: ./shared/identity-service/src/IdentityService.Api/Dockerfile
    restart: unless-stopped
    env_file:
      - path: ./backend/shared/identity-service/.env.example
        required: true
      - path: ./backend/shared/identity-service/.env
        required: false
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DbConnection: Host=identity-db;Port=5432;Database=postgres_db;Username=postgres;Password=postgres;Maximum Pool Size=200;Minimum Pool Size=20;Connection Idle Lifetime=60
      InternalAuth__ApiKey: local-identity-service-key
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__UserName: ${RABBITMQ_DEFAULT_USER:-autorent}
      RabbitMq__Password: ${RABBITMQ_DEFAULT_PASS:-autorent}
      RabbitMq__ExchangeName: ${RABBITMQ_EXCHANGE_NAME:-autorent.events}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      Observability__LogPath: /tmp/autorent/identity-service/identity-service.jsonl
    expose:
      - "8080"
    depends_on:
      identity-db:
        condition: service_healthy
      identity-flyway:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - backend
      - data
    volumes:
      - identity_logs:/tmp/autorent/identity-service

  chat-db:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: chat_db
    expose:
      - "27017"
    volumes:
      - chat_mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - data

  chat-service:
    build:
      context: ./backend
      dockerfile: ./shared/chat-service/src/ChatService.Api/Dockerfile
    restart: unless-stopped
    env_file:
      - path: ./backend/shared/chat-service/.env.example
        required: true
      - path: ./backend/shared/chat-service/.env
        required: false
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      MongoDB__ConnectionString: mongodb://chat-db:27017
      MongoDB__DatabaseName: chat_db
      InternalAuth__ApiKey: local-chat-service-key
      FileService__BaseUrl: http://file-service:8080
      FileService__InternalApiKey: local-file-service-key
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__UserName: ${RABBITMQ_DEFAULT_USER:-autorent}
      RabbitMq__Password: ${RABBITMQ_DEFAULT_PASS:-autorent}
      Cors__AllowedOrigins__0: http://localhost:5173
      Cors__AllowedOrigins__1: http://localhost:5174
      Cors__AllowedOrigins__2: http://localhost:5175
    expose:
      - "8080"
    depends_on:
      chat-db:
        condition: service_healthy
      file-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - backend
      - data

  car-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres_db
    expose:
      - "5432"
    volumes:
      - car_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres_db"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - data

  car-flyway:
    image: flyway/flyway:12
    restart: "no"
    depends_on:
      car-db:
        condition: service_healthy
    command: migrate
    volumes:
      - ./backend/external/car-service/src/Migrations:/flyway/sql:ro
    environment:
      FLYWAY_URL: jdbc:postgresql://car-db:5432/postgres_db
      FLYWAY_USER: postgres
      FLYWAY_PASSWORD: postgres
      FLYWAY_CONNECT_RETRIES: 30
    networks:
      - data

  car-market-value-service:
    build:
      context: ./backend/internal/car-market-value-service/src
      dockerfile: ./Dockerfile
    restart: unless-stopped
    env_file:
      - path: ./backend/internal/car-market-value-service/.env.example
        required: true
      - path: ./backend/internal/car-market-value-service/.env
        required: false
    environment:
      PORT: 8080
    expose:
      - "8080"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - backend

  car-service:
    build:
      context: ./backend
      dockerfile: ./external/car-service/src/CarService.Api/Dockerfile
    restart: unless-stopped
    env_file:
      - path: ./backend/external/car-service/.env.example
        required: true
      - path: ./backend/external/car-service/.env
        required: false
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DbConnection: Host=car-db;Port=5432;Database=postgres_db;Username=postgres;Password=postgres
      PartnerService__BaseUrl: http://partner-service:8080
      BookingService__BaseUrl: http://booking-service:8080
      BookingService__InternalApiKey: local-booking-service-key
      ClientService__BaseUrl: http://client-service:8080
      ClientService__InternalApiKey: local-client-service-key
      ImageService__BaseUrl: http://image-service:8080
      CarMarketValueService__BaseUrl: http://car-market-value-service:8080
      InternalAuth__ApiKey: local-car-service-key
      Observability__LogPath: /tmp/autorent/car-service/car-service.jsonl
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__UserName: ${RABBITMQ_DEFAULT_USER:-autorent}
      RabbitMq__Password: ${RABBITMQ_DEFAULT_PASS:-autorent}
      RabbitMq__ExchangeName: ${RABBITMQ_EXCHANGE_NAME:-autorent.events}
    expose:
      - "8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
      car-db:
        condition: service_healthy
      car-flyway:
        condition: service_completed_successfully
      car-market-value-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - backend
      - data
    volumes:
      - car_logs:/tmp/autorent/car-service

  ai-search-db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres_db
    expose:
      - "5432"
    ports:
      - "${AI_SEARCH_DB_PORT:-1836}:5432"
    volumes:
      - ai_search_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres_db"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - data

  ai-search-flyway:
    image: flyway/flyway:12
    restart: "no"
    depends_on:
      ai-search-db:
        condition: service_healthy
    command: migrate
    volumes:
      - ./backend/external/ai-search-service/src/Migrations:/flyway/sql:ro
    environment:
      FLYWAY_URL: jdbc:postgresql://ai-search-db:5432/postgres_db
      FLYWAY_USER: postgres
      FLYWAY_PASSWORD: postgres
      FLYWAY_CONNECT_RETRIES: 30
    networks:
      - data

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: 30m
    # GPU acceleration is opt-in via the override file docker-compose.gpu.yml:
    #   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
    # Requires nvidia-container-toolkit on the host (Linux) or Docker
    # Desktop with WSL2 + NVIDIA driver (Windows). ~10x faster than CPU.
    expose:
      - "11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - backend

  ollama-pull:
    image: curlimages/curl:8.13.0
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_CHAT_MODEL: ${LOCAL_LLM_CHAT_MODEL:-qwen2.5:1.5b}
      OLLAMA_EMBEDDING_MODEL: ${LOCAL_LLM_EMBEDDING_MODEL:-bge-m3}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for MODEL in "$$OLLAMA_CHAT_MODEL" "$$OLLAMA_EMBEDDING_MODEL"; do
          ATTEMPT=1
          while [ "$$ATTEMPT" -le 3 ]; do
            echo "Pulling $$MODEL (attempt $$ATTEMPT/3)..."
            if curl -fsSL --connect-timeout 30 --max-time 300 "$$OLLAMA_BASE_URL/api/pull" -H "Content-Type: application/json" -d "{\"model\":\"$$MODEL\",\"stream\":false}"; then
              echo "$$MODEL pulled OK"
              break
            fi
            echo "Retry in 5s..."
            sleep 5
            ATTEMPT=$$((ATTEMPT + 1))
          done
          if [ "$$ATTEMPT" -gt 3 ]; then
            echo "FATAL: failed to pull $$MODEL"
            exit 1
          fi
        done
        echo "Verifying..."
        curl -fsS "$$OLLAMA_BASE_URL/api/tags" | grep -q "$$OLLAMA_CHAT_MODEL" || { echo "FATAL: $$OLLAMA_CHAT_MODEL missing"; exit 1; }
        curl -fsS "$$OLLAMA_BASE_URL/api/tags" | grep -q "$$OLLAMA_EMBEDDING_MODEL" || { echo "FATAL: $$OLLAMA_EMBEDDING_MODEL missing"; exit 1; }
        echo "All models ready."
    networks:
      - backend

  ai-search-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    expose:
      - "6379"
    ports:
      - "${AI_SEARCH_REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - data

  ai-search-service:
    build:
      context: ./backend/external/ai-search-service/src
      dockerfile: ./Dockerfile
    restart: unless-stopped
    env_file:
      - path: ./backend/external/ai-search-service/.env.example
        required: true
      - path: ./backend/external/ai-search-service/.env
        required: false
    environment:
      PORT: 8080
      DATABASE_URL: postgres://postgres:postgres@ai-search-db:5432/postgres_db
      CAR_SERVICE_BASE_URL: http://car-service:8080
      PARTNER_SERVICE_BASE_URL: http://partner-service:8080
      BOOKING_SERVICE_BASE_URL: http://booking-service:8080
      API_GATEWAY_PUBLIC_BASE_URL: http://localhost:9186
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-autorent}:${RABBITMQ_DEFAULT_PASS:-autorent}@rabbitmq:5672
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE_NAME:-autorent.events}
      OBSERVABILITY_LOG_PATH: /tmp/autorent/ai-search-service/ai-search-service.jsonl
      AUTO_INDEX_ON_STARTUP: "true"
      AUTO_REFRESH_INTERVAL_SECONDS: 900
      LOCAL_LLM_BASE_URL: http://ollama:11434
      LOCAL_LLM_CHAT_MODEL: ${LOCAL_LLM_CHAT_MODEL:-qwen2.5:1.5b}
      LOCAL_LLM_EMBEDDING_MODEL: ${LOCAL_LLM_EMBEDDING_MODEL:-bge-m3}
      LOCAL_LLM_TIMEOUT_SECONDS: 90
      LLM_RECOMMENDATION_SUMMARY_ENABLED: "true"
      LLM_RECOMMENDATION_SUMMARY_TIMEOUT_MS: 5000
      REDIS_URL: redis://ai-search-redis:6379
      REDIS_CACHE_TTL_SECONDS: 300
    expose:
      - "8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
      ai-search-db:
        condition: service_healthy
      ai-search-flyway:
        condition: service_completed_successfully
      ai-search-redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
      car-service:
        condition: service_healthy
      partner-service:
        condition: service_healthy
      booking-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/healthz').then((res)=>process.exit(res.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - backend
      - data
    volumes:
      - ai_search_logs:/tmp/autorent/ai-search-service

  booking-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres_db
    # Match identity-db tuning: default max_connections=100 saturates fast
    # under booking creation load (Serializable transactions hold connections
    # longer than typical reads).
    command:
      - postgres
      - -c
      - max_connections=300
      - -c
      - shared_buffers=128MB
    expose:
      - "5432"
    volumes:
      - booking_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres_db"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - data

  booking-flyway:
    image: flyway/flyway:12
    restart: "no"
    depends_on:
      booking-db:
        condition: service_healthy
    command: migrate
    volumes:
      - ./backend/external/booking-service/src/Migrations:/flyway/sql:ro
    environment:
      FLYWAY_URL: jdbc:postgresql://booking-db:5432/postgres_db
      FLYWAY_USER: postgres
      FLYWAY_PASSWORD: postgres
      FLYWAY_CONNECT_RETRIES: 30
    networks:
      - data

  ai-damage-eval-service:
    build:
      context: ./backend/internal/ai-car-damage-eval-service/car-detection-service
      dockerfile: ./Dockerfile
    restart: unless-stopped
    environment:
      INTERNAL_API_KEY: local-ai-damage-eval-service-key
      ENVIRONMENT: production
      ALLOW_UNAUTHENTICATED_INTERNAL_DEV: "false"
      USE_REGISTRY_VALIDATION: "false"
      MIN_PHOTOS: 4
      MAX_PHOTOS: 5
    expose:
      - "8000"
    # /ready is backed by a warmup latch: only succeeds after YOLO weights
    # are in memory. This prevents booking-service from seeing the AI as
    # "up" while it's actually still loading ~450MB of model weights.
    # Generous start_period covers cold model load on CPU.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s
    networks:
      - backend

  booking-service:
    build:
      context: ./backend
      dockerfile: ./external/booking-service/src/BookingService.Api/Dockerfile
    restart: unless-stopped
    env_file:
      - path: ./backend/external/booking-service/.env.example
        required: true
      - path: ./backend/external/booking-service/.env
        required: false
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DbConnection: Host=booking-db;Port=5432;Database=postgres_db;Username=postgres;Password=postgres;Maximum Pool Size=200;Minimum Pool Size=20;Connection Idle Lifetime=60
      InternalAuth__ApiKey: local-booking-service-key
      Observability__LogPath: /tmp/autorent/booking-service/booking-service.jsonl
      CarService__BaseUrl: http://car-service:8080
      CarService__InternalApiKey: local-car-service-key
      PartnerService__BaseUrl: http://partner-service:8080
      PartnerService__InternalApiKey: local-partner-service-key
      ClientService__BaseUrl: http://client-service:8080
      ClientService__InternalApiKey: local-client-service-key
      IdentityService__BaseUrl: http://identity-service:8080
      IdentityService__InternalApiKey: local-identity-service-key
      PaymentService__BaseUrl: http://payment-service:8080
      PaymentService__InternalApiKey: local-payment-service-key
      TicketService__BaseUrl: http://ticket-service:8080
      EmailService__BaseUrl: http://email-service:8080
      DamageEvalService__BaseUrl: http://ai-damage-eval-service:8000
      DamageEvalService__InternalApiKey: local-ai-damage-eval-service-key
      # Must stay materially below PROXY_TIMEOUT_MS (60000) so the AI
      # call fails open before the gateway returns 504 to the client.
      DamageEvalService__TimeoutSeconds: 15
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__UserName: ${RABBITMQ_DEFAULT_USER:-autorent}
      RabbitMq__Password: ${RABBITMQ_DEFAULT_PASS:-autorent}
      RabbitMq__ExchangeName: ${RABBITMQ_EXCHANGE_NAME:-autorent.events}
    expose:
      - "8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
      booking-db:
        condition: service_healthy
      booking-flyway:
        condition: service_completed_successfully
      payment-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - backend
      - data
    volumes:
      - booking_logs:/tmp/autorent/booking-service

  client-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres_db
    expose:
      - "5432"
    volumes:
      - client_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres_db"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - data

  client-flyway:
    image: flyway/flyway:12
    restart: "no"
    depends_on:
      client-db:
        condition: service_healthy
    command: migrate
    volumes:
      - ./backend/external/client-service/src/Migrations:/flyway/sql:ro
    environment:
      FLYWAY_URL: jdbc:postgresql://client-db:5432/postgres_db
      FLYWAY_USER: postgres
      FLYWAY_PASSWORD: postgres
      FLYWAY_CONNECT_RETRIES: 30
    networks:
      - data

  client-service:
    build:
      context: ./backend/external/client-service/src
      dockerfile: ./ClientService.Api/Dockerfile
    restart: unless-stopped
    env_file:
      - path: ./backend/external/client-service/.env.example
        required: true
      - path: ./backend/external/client-service/.env
        required: false
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DbConnection: Host=client-db;Port=5432;Database=postgres_db;Username=postgres;Password=postgres
      InternalAuth__ApiKey: local-client-service-key
      ImageService__BaseUrl: http://image-service:8080
    expose:
      - "8080"
    depends_on:
      client-db:
        condition: service_healthy
      client-flyway:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - backend
      - data

  partner-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres_db
    expose:
      - "5432"
    volumes:
      - partner_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres_db"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - data

  partner-flyway:
    image: flyway/flyway:12
    restart: "no"
    depends_on:
      partner-db:
        condition: service_healthy
    command: migrate
    volumes:
      - ./backend/internal/partner-service/src/Migrations:/flyway/sql:ro
    environment:
      FLYWAY_URL: jdbc:postgresql://partner-db:5432/postgres_db
      FLYWAY_USER: postgres
      FLYWAY_PASSWORD: postgres
      FLYWAY_CONNECT_RETRIES: 30
    networks:
      - data

  partner-service:
    build:
      context: ./backend/internal/partner-service/src
      dockerfile: ./PartnerService.Api/Dockerfile
    restart: unless-stopped
    env_file:
      - path: ./backend/internal/partner-service/.env.example
        required: true
      - path: ./backend/internal/partner-service/.env
        required: false
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DbConnection: Host=partner-db;Port=5432;Database=postgres_db;Username=postgres;Password=postgres
      InternalAuth__ApiKey: local-partner-service-key
      FileService__BaseUrl: http://file-service:8080
      FileService__InternalApiKey: local-file-service-key
      PaymentService__BaseUrl: http://payment-service:8080
      PaymentService__InternalApiKey: local-payment-service-key
      BookingService__BaseUrl: http://booking-service:8080
      BookingService__InternalApiKey: local-booking-service-key
    expose:
      - "8080"
    depends_on:
      partner-db:
        condition: service_healthy
      partner-flyway:
        condition: service_completed_successfully
      payment-service:
        condition: service_healthy
      file-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - backend
      - data

  payment-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres_db
    expose:
      - "5432"
    volumes:
      - payment_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres_db"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - data

  payment-flyway:
    image: flyway/flyway:12
    restart: "no"
    depends_on:
      payment-db:
        condition: service_healthy
    command: migrate
    volumes:
      - ./backend/internal/payment-service/src/Migrations:/flyway/sql:ro
    environment:
      FLYWAY_URL: jdbc:postgresql://payment-db:5432/postgres_db
      FLYWAY_USER: postgres
      FLYWAY_PASSWORD: postgres
      FLYWAY_CONNECT_RETRIES: 30
    networks:
      - data

  payment-service:
    build:
      context: ./backend
      dockerfile: ./internal/payment-service/src/PaymentService.Api/Dockerfile
    restart: unless-stopped
    env_file:
      - path: ./backend/internal/payment-service/.env.example
        required: true
      - path: ./backend/internal/payment-service/.env
        required: false
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DbConnection: Host=payment-db;Port=5432;Database=postgres_db;Username=postgres;Password=postgres
      InternalAuth__ApiKey: local-payment-service-key
      Payment__Currency: KZT
      Payment__PlatformCommissionRate: 0.10
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__UserName: ${RABBITMQ_DEFAULT_USER:-autorent}
      RabbitMq__Password: ${RABBITMQ_DEFAULT_PASS:-autorent}
      RabbitMq__ExchangeName: ${RABBITMQ_EXCHANGE_NAME:-autorent.events}
    expose:
      - "8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
      payment-db:
        condition: service_healthy
      payment-flyway:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - backend
      - data

  ticket-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres_db
    expose:
      - "5432"
    volumes:
      - ticket_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres_db"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - data

  ticket-flyway:
    image: flyway/flyway:12
    restart: "no"
    depends_on:
      ticket-db:
        condition: service_healthy
    command: migrate
    volumes:
      - ./backend/internal/ticket-service/src/Migrations:/flyway/sql:ro
    environment:
      FLYWAY_URL: jdbc:postgresql://ticket-db:5432/postgres_db
      FLYWAY_USER: postgres
      FLYWAY_PASSWORD: postgres
      FLYWAY_CONNECT_RETRIES: 30
    networks:
      - data

  email-service:
    build:
      context: ./backend/shared/email-service/src
      dockerfile: ./Dockerfile
    restart: unless-stopped
    env_file:
      - path: ./backend/shared/email-service/.env.example
        required: true
      - path: ./backend/shared/email-service/.env
        required: false
    environment:
      PORT: 8080
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-autorent}:${RABBITMQ_DEFAULT_PASS:-autorent}@rabbitmq:5672
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE_NAME:-autorent.events}
      OBSERVABILITY_LOG_PATH: /tmp/autorent/email-service/email-service.jsonl
    expose:
      - "8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/healthz').then((res)=>process.exit(res.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - backend
    volumes:
      - email_logs:/tmp/autorent/email-service

  ticket-service:
    build:
      context: ./backend
      dockerfile: ./internal/ticket-service/src/TicketService.Api/Dockerfile
    restart: unless-stopped
    env_file:
      - path: ./backend/internal/ticket-service/.env.example
        required: true
      - path: ./backend/internal/ticket-service/.env
        required: false
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DbConnection: Host=ticket-db;Port=5432;Database=postgres_db;Username=postgres;Password=postgres
      BookingService__BaseUrl: http://booking-service:8080
      BookingService__InternalApiKey: local-booking-service-key
      IdentityService__BaseUrl: http://identity-service:8080
      IdentityService__InternalApiKey: local-identity-service-key
      EmailService__BaseUrl: http://email-service:8080
      ClientService__BaseUrl: http://client-service:8080
      ClientService__InternalApiKey: local-client-service-key
      PartnerService__BaseUrl: http://partner-service:8080
      PartnerService__InternalApiKey: local-partner-service-key
      FileService__BaseUrl: http://file-service:8080
      FileService__InternalApiKey: local-file-service-key
      ImageService__BaseUrl: http://image-service:8080
      CarService__BaseUrl: http://car-service:8080
      CarService__InternalApiKey: local-car-service-key
      ChatService__BaseUrl: http://chat-service:8080
      ChatService__InternalApiKey: local-chat-service-key
      PaymentService__BaseUrl: http://payment-service:8080
      PaymentService__InternalApiKey: local-payment-service-key
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__UserName: ${RABBITMQ_DEFAULT_USER:-autorent}
      RabbitMq__Password: ${RABBITMQ_DEFAULT_PASS:-autorent}
      RabbitMq__ExchangeName: ${RABBITMQ_EXCHANGE_NAME:-autorent.events}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      Observability__LogPath: /tmp/autorent/ticket-service/ticket-service.jsonl
    expose:
      - "8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
      ticket-db:
        condition: service_healthy
      ticket-flyway:
        condition: service_completed_successfully
      identity-service:
        condition: service_healthy
      email-service:
        condition: service_healthy
      client-service:
        condition: service_healthy
      partner-service:
        condition: service_healthy
      file-service:
        condition: service_healthy
      image-service:
        condition: service_healthy
      car-service:
        condition: service_healthy
      chat-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - backend
      - data
    volumes:
      - ticket_logs:/tmp/autorent/ticket-service

  image-service:
    build:
      context: ./backend/shared/image-service/src
      dockerfile: ./Dockerfile
    restart: unless-stopped
    env_file:
      - path: ./backend/shared/image-service/.env.example
        required: true
      - path: ./backend/shared/image-service/.env
        required: false
    environment:
      PORT: 8080
      PUBLIC_BASE_URL: ${IMAGE_SERVICE_PUBLIC_BASE_URL:-http://localhost:9186/internal}
    expose:
      - "8080"
    volumes:
      - image_uploads:/app/uploads
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/healthz').then((res)=>process.exit(res.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - backend

  file-service:
    build:
      context: ./backend/internal/file-service/src
      dockerfile: ./Dockerfile
    restart: unless-stopped
    env_file:
      - path: ./backend/internal/file-service/.env.example
        required: true
      - path: ./backend/internal/file-service/.env
        required: false
    environment:
      PORT: 8080
      INTERNAL_API_KEY: local-file-service-key
      PUBLIC_BASE_URL: ${FILE_SERVICE_PUBLIC_BASE_URL:-http://localhost:9186/files}
    expose:
      - "8080"
    volumes:
      - file_uploads:/app/uploads
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/healthz').then((res)=>process.exit(res.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - backend

  api-gateway:
    build:
      context: ./backend/external/reverse-proxy-service/src
      dockerfile: ./Dockerfile
    restart: unless-stopped
    environment:
      IDENTITY_SERVICE_URL: http://identity-service:8080
      CAR_SERVICE_URL: http://car-service:8080
      AI_SEARCH_SERVICE_URL: http://ai-search-service:8080
      BOOKING_SERVICE_URL: http://booking-service:8080
      CLIENT_SERVICE_URL: http://client-service:8080
      PARTNER_SERVICE_URL: http://partner-service:8080
      TICKET_SERVICE_URL: http://ticket-service:8080
      FILE_SERVICE_URL: http://file-service:8080
      CHAT_SERVICE_URL: http://chat-service:8080
      INTERNAL_SERVICE_URL: http://image-service:8080
      PAYMENT_SERVICE_URL: http://payment-service:8080
      ALLOWED_ORIGINS: http://localhost:5173,http://localhost:5174,http://localhost:5175
      RATE_LIMIT_WINDOW_MS: 60000
      RATE_LIMIT_MAX_REQUESTS: 300
      PROXY_TIMEOUT_MS: 60000
      REQUEST_TIMEOUT_MS: 60000
      PORT: 8080
      HTTPS_PORT: 8443
      TLS_ENABLED: "true"
      HTTP_TO_HTTPS_REDIRECT: "false"
      TLS_CERT_PATH: /tmp/autorent-edge.crt
      TLS_KEY_PATH: /tmp/autorent-edge.key
      TLS_CERT_CN: localhost
      TLS_CERT_DAYS: 30
      TRUST_PROXY: loopback, linklocal, uniquelocal
      OTEL_SERVICE_NAME: api-gateway
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      OBSERVABILITY_LOG_PATH: /tmp/autorent/api-gateway/api-gateway.jsonl
    ports:
      - "${API_GATEWAY_PORT:-9186}:8080"
      - "${API_GATEWAY_TLS_PORT:-9443}:8443"
    depends_on:
      identity-service:
        condition: service_healthy
      car-service:
        condition: service_healthy
      ai-search-service:
        condition: service_healthy
      booking-service:
        condition: service_healthy
      client-service:
        condition: service_healthy
      partner-service:
        condition: service_healthy
      ticket-service:
        condition: service_healthy
      file-service:
        condition: service_healthy
      chat-service:
        condition: service_healthy
      image-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/healthz').then((res)=>process.exit(res.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - frontend
      - backend
    volumes:
      - gateway_logs:/tmp/autorent/api-gateway

  frontend:
    build:
      context: ./frontend/external
      dockerfile: ./Dockerfile
    restart: unless-stopped
    env_file:
      - path: ./frontend/external/.env.example
        required: true
      - path: ./frontend/external/.env
        required: false
    command: npm run dev -- --host
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5173').then((res)=>process.exit(res.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - frontend

  internal-frontend:
    build:
      context: ./frontend/internal
      dockerfile: ./Dockerfile
    restart: unless-stopped
    env_file:
      - path: ./frontend/internal/.env.example
        required: true
      - path: ./frontend/internal/.env
        required: false
    command: npm run dev -- --host
    ports:
      - "${INTERNAL_FRONTEND_PORT:-5174}:5173"
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5173').then((res)=>process.exit(res.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - frontend

  superadmin-frontend:
    build:
      context: ./frontend/superadmin
      dockerfile: ./Dockerfile
    restart: unless-stopped
    env_file:
      - path: ./frontend/superadmin/.env.example
        required: true
      - path: ./frontend/superadmin/.env
        required: false
    command: npm run dev -- --host
    ports:
      - "${SUPERADMIN_FRONTEND_PORT:-5175}:5173"
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5173').then((res)=>process.exit(res.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - frontend

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./ops/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - backend

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    restart: unless-stopped
    command:
      - --config=/etc/otelcol-contrib/config.yml
    volumes:
      - ./ops/observability/otel-collector/config.yml:/etc/otelcol-contrib/config.yml:ro
    expose:
      - "4317"
      - "4318"
      - "13133"
    networks:
      - backend

  tempo:
    image: grafana/tempo:2.3.1
    restart: unless-stopped
    user: "0"
    command:
      - -config.file=/etc/tempo/tempo.yml
    volumes:
      - ./ops/observability/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/tmp/tempo
    ports:
      - "${TEMPO_PORT:-3200}:3200"
    networks:
      - backend

  loki:
    image: grafana/loki:latest
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/config.yml
    volumes:
      - ./ops/observability/loki/config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    ports:
      - "${LOKI_PORT:-3100}:3100"
    networks:
      - backend

  promtail:
    image: grafana/promtail:latest
    restart: unless-stopped
    command:
      - -config.file=/etc/promtail/promtail.yml
    depends_on:
      - loki
    volumes:
      - ./ops/observability/promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - car_logs:/tmp/autorent/car-service:ro
      - booking_logs:/tmp/autorent/booking-service:ro
      - gateway_logs:/tmp/autorent/api-gateway:ro
      - ticket_logs:/tmp/autorent/ticket-service:ro
      - identity_logs:/tmp/autorent/identity-service:ro
      - email_logs:/tmp/autorent/email-service:ro
      - ai_search_logs:/tmp/autorent/ai-search-service:ro
    networks:
      - backend

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki
      - tempo
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/autorent-observability.json
    volumes:
      - ./ops/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    networks:
      - backend

volumes:
  rabbitmq_data:
  identity_pgdata:
  chat_mongodata:
  car_pgdata:
  ai_search_pgdata:
  ollama_data:
  booking_pgdata:
  client_pgdata:
  partner_pgdata:
  payment_pgdata:
  ticket_pgdata:
  image_uploads:
  file_uploads:
  grafana_data:
  tempo_data:
  loki_data:
  gateway_logs:
  ticket_logs:
  identity_logs:
  email_logs:
  ai_search_logs:
  car_logs:
  booking_logs:

networks:
  frontend:
  backend:
  data:
    internal: true
