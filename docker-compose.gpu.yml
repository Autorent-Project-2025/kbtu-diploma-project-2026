# GPU override for Ollama — enables NVIDIA CUDA inference.
#
# Usage (combined with main compose file):
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d ollama ai-search-service
#
# Prerequisites:
#   Linux host:     apt install nvidia-container-toolkit && systemctl restart docker
#   Windows host:   Docker Desktop 4.x + WSL2 + up-to-date NVIDIA driver
#                   (GPU automatically exposed to containers via WSL)
#   Verify:         docker run --rm --gpus all nvidia/cuda:12.4.0-base-ubuntu22.04 nvidia-smi
#
# Expected speedup (RTX 3060, qwen2.5:1.5b):
#   CPU:  ~20 tokens/sec, 15-25s per LLM call
#   GPU:  ~200 tokens/sec, 1-3s per LLM call
#   Result: LLM rerank/summary fit under 5s without timeouts.

services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
